apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: billing-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: billing-service
  # Prod's floor. stag patches this down to 1 (hpa-patch.yaml) to save cost;
  # prod additionally pins it back to 2 explicitly (hpa-patch.yaml) so a
  # future change to this base value cannot silently reduce prod capacity.
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
