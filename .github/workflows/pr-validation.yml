name: PR Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [stag, prod]
  push:
    branches: [stag, prod]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test:coverage
      - name: Build
        run: bun run build
      - name: Docker build
        run: docker build -t workshop-billing:ci .
      # SONAR_TOKEN is not yet configured for this repository (a human must run
      # `gh secret set SONAR_TOKEN --repo tech-challenges-fiap/workshop-billing`).
      # `ci` is a required status check for stag/prod branch protection, so
      # continue-on-error keeps this step from failing the required job while
      # the secret is missing. Remove continue-on-error once SONAR_TOKEN exists
      # and the scan is expected to succeed reliably.
      - name: Sonar
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  k8s:
    name: k8s
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize k8s/overlays/stag >/tmp/billing-service-stag.yaml
          kubectl kustomize k8s/overlays/prod >/tmp/billing-service-prod.yaml
