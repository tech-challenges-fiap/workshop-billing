name: PR Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [stag, prod]
  push:
    branches: [stag, prod]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Docker build
        run: docker build -t workshop-billing:ci .
